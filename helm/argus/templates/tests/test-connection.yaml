apiVersion: v1
kind: Pod
metadata:
  name: {{ include "argus.fullname" . }}-test
  labels:
    {{- include "argus.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    # Reuses the backend image, which already has Python, so the test pulls nothing new.
    - name: smoke
      image: {{ include "argus.image" (dict "ctx" . "component" "backend") }}
      command:
        - python
        - -c
        - |
          import json, urllib.request
          backend = "http://{{ include "argus.backendName" . }}:{{ .Values.backend.port }}"
          frontend = "http://{{ include "argus.frontendName" . }}:{{ .Values.frontend.service.port }}"
          ready = json.load(urllib.request.urlopen(backend + "/ready", timeout=5))
          assert ready["database"] == "ok", ready
          budget = json.load(urllib.request.urlopen(frontend + "/api/slo/budget", timeout=5))
          print("backend ready, frontend proxies the API:", budget["services"], "services")
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
