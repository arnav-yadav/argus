{{- if and .Values.metrics.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
# Rendered only when the Prometheus Operator CRDs exist, so the chart still installs on
# a bare cluster.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "argus.backendName" . }}
  labels:
    {{- include "argus.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "argus.selectorLabels" (dict "ctx" . "component" "backend") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      # Argus metrics carry a `service` label naming the *monitored* service. Kubernetes
      # discovery attaches its own `service` label (this Service's name), and without
      # honorLabels Prometheus would rename ours to `exported_service`, collapsing every
      # monitored service into one series. Our metrics set no job/pod/namespace labels,
      # so honouring them overrides nothing else.
      honorLabels: true
{{- end }}
