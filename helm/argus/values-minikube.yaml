# Local GitOps target. ArgoCD syncs the chart with this file from main.
# The CI `promote` job rewrites image.tag after every green build of main.
image:
  tag: sha-cff0572

postgres:
  existingSecret: argus-db

simulator:
  enabled: true
  image:
    tag: sha-5c0ebeb   # pinned on purpose; bump by hand when simulator/ changes

ingress:
  enabled: true
  host: argus.localhost

metrics:
  serviceMonitor:
    labels:
      release: monitoring
  prometheusRule:
    labels:
      release: monitoring
